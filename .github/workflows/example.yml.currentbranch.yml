name: Minimal Example (current branch)
on: workflow_dispatch
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

